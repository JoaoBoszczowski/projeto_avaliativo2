services:

  web:
    build: .
    image: ${DOCKERHUB_USERNAME}/helpdesk-escolar:latest
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: helpdesk
      DB_USER: helpdesk_user
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-helpdesk

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: helpdesk_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dados-mysql:/var/lib/mysql
      - ./banco/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rede-helpdesk

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rede-helpdesk

volumes:
  dados-mysql:

networks:
  rede-helpdesk:
    driver: bridge
